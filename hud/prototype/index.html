<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD prototype</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px;
    background: radial-gradient(ellipse at center, #0b1624 0%, #04070d 100%);
    color: #9fd8ff; font: 14px/1.4 -apple-system, system-ui, sans-serif;
  }
  main { display: grid; gap: 24px; justify-items: center; padding: 24px 16px; }
  canvas { width: min(420px, 90vw); aspect-ratio: 1; display: block; }
  .panel {
    display: grid; gap: 14px; width: min(420px, 90vw); padding: 16px;
    border: 1px solid #1b3a55; border-radius: 12px; background: rgba(8, 20, 34, 0.7);
  }
  .states { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; color: inherit; background: #0d2338; border: 1px solid #1f4a6e;
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: #12314d; }
  button[aria-pressed="true"] { background: #1b5a8a; border-color: #5ac8ff; color: #fff; }
  label { display: grid; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; }
  input[type="range"] { width: 100%; }
  small { color: #6a8fa8; }
</style>
</head>
<body>
<main>
  <canvas id="hud" aria-label="Assistant status rings"></canvas>
  <section class="panel" aria-label="Debug controls">
    <div class="states" id="states" role="group" aria-label="State"></div>
    <label>
      <span>Amplitude: <output id="ampOut">0.00</output></span>
      <input id="amp" type="range" min="0" max="1" step="0.01" value="0">
    </label>
    <div class="row">
      <input id="sim" type="checkbox" checked>
      <label for="sim">Simulate voice in listening / speaking</label>
    </div>
    <div class="row">
      <input id="reduce" type="checkbox">
      <label for="reduce">Reduced motion</label>
    </div>
    <small>Keys 1-6 switch states. The error state returns to idle on its own.</small>
  </section>
</main>
<script src="hud.js"></script>
<script>
(function () {
  const canvas = document.getElementById("hud");
  const statesEl = document.getElementById("states");
  const amp = document.getElementById("amp");
  const ampOut = document.getElementById("ampOut");
  const sim = document.getElementById("sim");
  const reduce = document.getElementById("reduce");

  const media = window.matchMedia("(prefers-reduced-motion: reduce)");
  reduce.checked = media.matches;

  const buttons = {};
  const hud = HudRings.createHud(canvas, {
    reducedMotion: media.matches,
    onStateChange: (name) => {
      for (const [n, b] of Object.entries(buttons)) b.setAttribute("aria-pressed", String(n === name));
    },
  });

  HudRings.STATES.forEach((name, i) => {
    const b = document.createElement("button");
    b.textContent = `${i + 1} ${name}`;
    b.addEventListener("click", () => hud.setState(name));
    statesEl.appendChild(b);
    buttons[name] = b;
  });

  amp.addEventListener("input", () => {
    ampOut.textContent = Number(amp.value).toFixed(2);
    hud.setAmplitude(Number(amp.value));
  });
  reduce.addEventListener("change", () => hud.setReducedMotion(reduce.checked));

  window.addEventListener("keydown", (e) => {
    const name = HudRings.STATES[Number(e.key) - 1];
    if (name) hud.setState(name);
  });

  // Fake speech-like amplitude: bursts of syllables with pauses between words.
  let t = 0;
  setInterval(() => {
    if (!sim.checked) return;
    const s = hud.getState();
    if (s !== "listening" && s !== "speaking") return;
    t += 0.05;
    const word = Math.max(0, Math.sin(t * 1.3)) ** 0.5;
    const syllable = 0.5 + 0.5 * Math.sin(t * 13);
    const v = word * (0.35 + 0.65 * syllable) * (0.8 + 0.2 * Math.random());
    amp.value = v.toFixed(2);
    amp.dispatchEvent(new Event("input"));
  }, 50);

  // Outside those states the slider decays to silence unless the user holds it.
  setInterval(() => {
    const s = hud.getState();
    if (sim.checked && s !== "listening" && s !== "speaking" && Number(amp.value) > 0) {
      amp.value = Math.max(0, Number(amp.value) - 0.1).toFixed(2);
      amp.dispatchEvent(new Event("input"));
    }
  }, 100);

  hud.setState("idle");
  hud.start();
})();
</script>
</body>
</html>
